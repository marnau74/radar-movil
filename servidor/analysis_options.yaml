include: package:very_good_analysis/analysis_options.yaml

formatter:
  page_width: 120

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # La documentación pública se escribe donde aporta, no en cada miembro.
    public_member_api_docs: false
    lines_longer_than_80_chars: false
    # La sintaxis nueva de constructores (`new(...)`, Dart 3.12) aún es poco conocida: se mantiene la clásica.
    unnecessary_type_name_in_constructor: false
