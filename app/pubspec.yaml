name: radar_movil
description: "Seguimiento de ofertas a licitaciones públicas: la app móvil del radar de licitaciones."
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.5
  flutter: ">=3.47.0"

dependencies:
  dio: ^5.11.1
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_appauth: ^12.1.0
  flutter_local_notifications: ^22.3.2
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_timezone: ^5.1.1
  freezed_annotation: ^3.1.0
  go_router: ^18.0.2
  intl: ^0.20.3
  json_annotation: ^4.12.0
  path_provider: ^2.1.6
  riverpod_annotation: ^4.0.7
  timezone: ^0.11.2
  url_launcher: ^6.3.3
  workmanager: ^0.10.10

dev_dependencies:
  build_runner: ^2.16.2
  drift_dev: ^2.35.1
  flutter_test:
    sdk: flutter
  freezed: ^4.0.2
  go_router_builder: ^4.5.0
  json_serializable: ^6.14.1
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.9
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  # IBM Plex Sans (licencia OFL, en assets/fuentes/OFL.txt).
  fonts:
    - family: IBM Plex Sans
      fonts:
        - asset: assets/fuentes/IBMPlexSans-Regular.ttf
        - asset: assets/fuentes/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fuentes/IBMPlexSans-SemiBold.ttf
          weight: 600
        - asset: assets/fuentes/IBMPlexSans-Bold.ttf
          weight: 700
